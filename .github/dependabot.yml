version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /poller
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
